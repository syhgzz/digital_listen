# 数字听力训练 (K3) — 独立站点配置
# app: digital-listen-k3
#
# 由 deploy.sh 渲染后安装到 /etc/nginx/conf.d/k3.conf:
# 占位符 __DEPLOY_DIR__ 会被替换为实际的静态文件目录。
# 本文件是新增配置,不会修改服务器上任何已有文件。
#
# 访问入口: http://<服务器IP>:53001/
# 注意: 云服务器安全组 / 防火墙需放行 53001 端口。

server {
    listen 53001;
    server_name _;

    root __DEPLOY_DIR__;
    index index.html;

    # 大文件(语音模型 / WASM 运行时): 内容固定,长缓存
    location ^~ /models/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /wasm/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vite 产物带内容哈希,长缓存
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 入口: 未命中的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# 备注: 需要 nginx >= 1.21(mime.types 自带 application/wasm)。
# 若版本更旧,请在 http 块中补充: types { application/wasm wasm; }
