# 数字听力训练（digital_listen）— nginx 部署配置
#
# 用法：
#   sudo cp nginx/digital-listen.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置：先执行 npm run build，并把 dist/ 的内容放到下面的 root 目录，
# 例如 sudo rsync -a --delete dist/ /var/www/digital_listen_dsh41f/

server {
    listen      53002;
    # 服务器启用了 IPv6 时可放开下一行；若系统关闭了 IPv6，nginx 会因 socket 失败而启动不了
    # listen   [::]:53002;
    server_name _;

    # 构建产物目录（含 assets/ 与 tts/，tts/ 来自 public/tts）
    root  /var/www/digital_listen_dsh41f;
    index index.html;

    charset      utf-8;
    server_tokens off;

    access_log /var/log/nginx/digital_listen.access.log;
    error_log  /var/log/nginx/digital_listen.error.log warn;

    client_max_body_size 1m;

    # 压缩：wasm 收益最大（约 14MB → 3.6MB）；
    # onnx / data 是二进制模型，不列入以省 CPU，仅首次加载一次并被长期缓存。
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # COOP + COEP 让页面处于 crossOriginIsolated，ONNX Runtime 才能启用多线程
    # （否则回退单线程，功能正常但合成更慢）。
    # 注意：启用后页面内的跨域资源必须带 CORP/CORS 头；本应用所有资源同源，
    # 若以后引入外部 CDN 图片/脚本，请删掉下面两行或改用 credentialless。
    # 另外只有 HTTPS 或 localhost 才是 secure context，纯 HTTP 访问会忽略它们。
    add_header Cross-Origin-Opener-Policy   same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options       nosniff always;
    add_header Referrer-Policy              strict-origin-when-cross-origin always;

    # SPA 入口：始终回源校验，避免发布后仍加载旧 HTML
    location = /index.html {
        expires -1;
    }

    # Vite 产物：文件名含内容哈希，可长期缓存
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # 部分发行版的 mime.types 没有 wasm 条目，缺了会让浏览器退回非流式实例化。
    # 用 default_type 而不是 types{}，避免覆盖整个 MIME 映射表；按路径区分缓存策略。
    location ~* ^/assets/.*\.wasm$ {
        default_type application/wasm;
        expires 1y;
        try_files $uri =404;
    }

    # Piper 运行时（phonemizer 的 js/wasm/data）：随 npm 依赖变化，必须每次校验
    location /tts/piper/ {
        expires -1;
        try_files $uri =404;
    }

    location ~* ^/tts/piper/.*\.wasm$ {
        default_type application/wasm;
        expires -1;
        try_files $uri =404;
    }

    # 语音模型：.onnx 约 60MB，长期缓存；manifest/配置需要及时更新
    location /tts/voices/ {
        try_files $uri =404;

        location ~* \.onnx$ {
            expires 1y;
        }

        location ~* \.json$ {
            expires -1;
        }
    }

    # /tts/ 下任何缺失文件都返回 404，而不是回退到 index.html
    location /tts/ {
        try_files $uri =404;
    }

    # 其余静态资源。注意 /tts/ 与 /assets/ 使用 =404 而不是回退 index.html，
    # 这样语音资源缺失时前端能拿到 404 并给出「请先运行 npm run tts:setup」提示，
    # 而不是把 HTML 当成模型解析导致难以排查的报错。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 如需 HTTPS（推荐，跨域隔离与浏览器新特性都要求安全上下文），可改用：
#
# server {
#     listen 53002 ssl;
#     # listen [::]:53002 ssl;
#     server_name listen.example.com;
#
#     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
#     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_session_cache   shared:SSL:10m;
#
#     # 其余 location / add_header 与上面的 server 块保持一致
#     location / { ... }
# }
